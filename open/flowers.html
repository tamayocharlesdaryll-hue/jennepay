<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flowers + A Song ♡</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&family=Sacramento&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="hearts"></div>

    <main class="page">

        <section class="wide-card">

            <div class="flower-layout">


                <!-- FLOWERS -->
                <div class="bouquet-art">

                    <div class="flower flower1">♥</div>
                    <div class="flower flower2">♥</div>
                    <div class="flower flower3">♥</div>
                    <div class="flower flower4">♥</div>
                    <div class="flower flower5">♥</div>

                    <div class="paper-wrap"></div>

                    <div class="ribbon">
                        ♡
                    </div>

                </div>


                <!-- SONG -->
                <div class="song-side">

                    <p class="eyebrow">
                        just for you
                    </p>

                    <h1>
                        flowers!
                        <br>

                        <span>
                            and a song 4 you
                        </span>
                    </h1>


                    <div class="song-card">

                        <div class="song-disc">
                            ♫
                        </div>

                        <div class="song-info">

                            <strong>
                                You're All I Want
                            </strong>

                            <small>
                                my little dedication
                            </small>

                        </div>

                        <button class="play-btn" id="playButton">
                            ▶
                        </button>

                    </div>


                    <p class="song-hint">
                        Add your music file as
                        <b>song.mp3</b>
                        in the website folder.
                    </p>


                    <audio id="song" src="song.mp3"></audio>


                    <a href="gifts.html" class="text-link">
                        ← return to gifts
                    </a>

                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
