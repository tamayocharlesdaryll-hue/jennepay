<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pick Your Gift ♡</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&family=Sacramento&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="hearts"></div>

    <main class="page gifts-page">

        <section class="wide-card">

            <p class="eyebrow">
                something special awaits
            </p>

            <h1>
                pick and click!
            </h1>

            <p class="subtitle">
                choose the little gift you want to open first ♡
            </p>

            <div class="gift-grid">

                <!-- MEMORY -->
                <a href="memories.html" class="gift-card">

                    <div class="gift-icon photo-icon">

                        <div class="sun"></div>

                        <div class="mountain"></div>

                    </div>

                    <h3>
                        Memories
                    </h3>

                    <p>
                        our little moments
                    </p>

                    <span class="open-label">
                        open →
                    </span>

                </a>


                <!-- LETTER -->
                <a href="letter.html" class="gift-card">

                    <div class="gift-icon envelope">
                        ♡
                    </div>

                    <h3>
                        A letter
                    </h3>

                    <p>
                        words from my heart
                    </p>

                    <span class="open-label">
                        open →
                    </span>

                </a>


                <!-- FLOWERS -->
                <a href="flowers.html" class="gift-card">

                    <div class="gift-icon bouquet">
                        💐
                    </div>

                    <h3>
                        Flowers + song
                    </h3>

                    <p>
                        a little surprise for you
                    </p>

                    <span class="open-label">
                        open →
                    </span>

                </a>

            </div>

            <a href="index.html" class="text-link">
                ← return
            </a>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
